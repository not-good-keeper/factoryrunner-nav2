# Applied automatically with sim.launch.py slam:=True. slam_toolbox otherwise runs on its own
# defaults, because nav2_params.yaml has no section for it.
slam_toolbox:
  ros__parameters:
    use_sim_time: True
    mode: mapping
    base_frame: base_footprint
    odom_frame: odom
    map_frame: map
    scan_topic: /scan
    resolution: 0.05
    transform_publish_period: 0.02
    transform_timeout: 0.5
