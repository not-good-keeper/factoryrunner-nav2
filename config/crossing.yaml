# Map-frame poses on Nav2's depot map. The robot spawns at Gazebo (-8, 0), which is
# the map origin. Stations were picked from depot.pgm with >= 1.7 m clearance to the
# nearest occupied cell; check them in RViz before trusting them.
mission:
  job_id: JOB-001
  frame_id: map
  initial_pose: {x: 0.0, y: 0.0, yaw: 0.0}
  stations:
    - {name: RAW_MATERIAL, x: 4.5, y: -4.0, yaw: 0.0}
    - {name: CNC_CELL, x: 12.0, y: 1.28, yaw: 1.57}
    - {name: INSPECTION, x: 6.0, y: 1.5, yaw: 3.14}
    - {name: DOCK, x: 0.0, y: 0.0, yaw: 0.0}
  # laps, obstacle_laps and obstacle are read by trial_runner; mission_controller drives one loop.
  laps: 3
  obstacle_laps: [1, 2, 3]
  # Moving obstacle: spawns at the shelf edge beside the CNC_CELL path and crosses it to the
  # open side of the aisle at walking pace, so the robot has to react while it is in motion.
  obstacle:
    leg: CNC_CELL
    x: 8.13
    y: -1.22
    spawn_distance: 3.0
    motion: {to_x: 6.73, to_y: 0.85, speed: 0.25}
