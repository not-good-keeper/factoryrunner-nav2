name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/factoryrunner-nav2
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src src/factoryrunner-nav2/factoryrunner_vision --ignore-src -y --rosdistro jazzy
          apt-get install -y python3-pytest python3-flake8
      - name: Lint
        # flake8 7 reads config only from the working directory, so name the repo's setup.cfg
        run: flake8 --config src/factoryrunner-nav2/setup.cfg src/factoryrunner-nav2
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # factoryrunner_vision is nested in the Python package, where colcon's search stops
          colcon build --symlink-install --base-paths src src/factoryrunner-nav2/factoryrunner_vision
      - name: Unit tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest -q src/factoryrunner-nav2/test
          colcon test --base-paths src src/factoryrunner-nav2/factoryrunner_vision --packages-select factoryrunner_vision
          colcon test-result --test-result-base build/factoryrunner_vision --verbose
